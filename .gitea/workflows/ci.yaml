name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: make lint
        run: make lint

  # The suite talks to a real Postgres (ADR-0002): burrow's store is Postgres,
  # and a store tested against a fake is a store nobody has tested. The tests
  # fail outright when BURROW_TEST_DATABASE_URL is missing rather than skipping,
  # so a green run here proves the database was actually reached — the failure
  # mode cairn documents, where a suite self-skips under a green pipeline and
  # the gate silently stops gating.
  #
  # Why a user-defined network rather than a `services:` sidecar or a published
  # port, established empirically on this runner fleet (cairn's probe run 4005,
  # recorded in cairn's pipeline.yaml header): jobs run *inside* a container, so
  # `localhost` is the job's own netns and a sidecar published there is
  # unreachable; `host.docker.internal` does not resolve; and a fixed host port
  # collides, because six runners share one daemon at capacity 3. Attaching this
  # job's own container to a run-scoped network is what works — Docker's
  # embedded DNS then resolves `postgres` by its network alias.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NET: burrow-ci-${{ gitea.run_id }}
      PG: burrow-pg-${{ gitea.run_id }}
    steps:
      # cancel-in-progress kills the job container without running its
      # `if: always()` steps, so every superseding push would otherwise leave a
      # network and a Postgres behind on a shared daemon. Reclaim the ones whose
      # job is gone: no live task container attached, and labelled as burrow's.
      - name: Reap sidecars left by cancelled runs
        run: |
          set -euo pipefail
          for net in $(docker network ls --filter 'name=^burrow-ci-' --format '{{.Name}}'); do
            [ "$(docker network inspect -f '{{.Labels.ci.owner}}' "$net")" = "burrow" ] || continue
            live=""
            for c in $(docker network inspect -f '{{range .Containers}}{{.Name}} {{end}}' "$net"); do
              case "${c#/}" in
                GITEA-ACTIONS-TASK-*)
                  if [ "$(docker inspect -f '{{.State.Running}}' "${c#/}" 2>/dev/null)" = "true" ]; then
                    live=1
                  fi
                  ;;
              esac
            done
            if [ -n "$live" ]; then
              echo "keeping $net: a live job is attached"
              continue
            fi
            for c in $(docker network inspect -f '{{range .Containers}}{{.Name}} {{end}}' "$net"); do
              docker rm -f "${c#/}" >/dev/null 2>&1 || true
            done
            echo "reaping $net (no live job attached)"
            docker network rm "$net" >/dev/null 2>&1 || true
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Postgres on a run-scoped network
        run: |
          set -euo pipefail
          docker network create --label ci.owner=burrow --label "ci.run=${{ gitea.run_id }}" "$NET"
          # Durability off: this database exists for one run and is thrown away,
          # so there is nothing to protect from a crash. Every test creates a
          # private schema and applies the whole DDL, and on a contended runner
          # disk those fsyncs are the suite. No SQL semantics change —
          # transactions, locks and visibility are identical; only the flush is.
          docker run -d --name "$PG" --network "$NET" --network-alias postgres \
            --label ci.owner=burrow --label "ci.run=${{ gitea.run_id }}" \
            -e POSTGRES_USER=burrow -e POSTGRES_PASSWORD=burrow -e POSTGRES_DB=burrow \
            postgres:18-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          # Join the job container itself, so `postgres` resolves from here.
          docker network connect "$NET" "$HOSTNAME"

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker exec "$PG" pg_isready -h 127.0.0.1 -p 5432 -U burrow >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "postgres never became ready" >&2
          exit 1

      - name: make test
        env:
          BURROW_TEST_DATABASE_URL: postgres://burrow:burrow@postgres:5432/burrow?sslmode=disable
        run: make test

      - name: Tear down
        if: always()
        run: |
          docker network disconnect "$NET" "$HOSTNAME" >/dev/null 2>&1 || true
          docker rm -f "$PG" >/dev/null 2>&1 || true
          # Not hidden: `docker network rm` fails only when something is still
          # attached, and a silent failure is how a network keeps its /16 until
          # a human goes looking.
          if ! docker network rm "$NET" >/dev/null 2>&1; then
            echo "::warning::$NET could not be removed, still attached:"
            docker network inspect "$NET" -f '{{range .Containers}}  {{println .Name}}{{end}}' || true
          fi

  # Nothing above builds the Dockerfile, and ship.yaml, which does, runs only
  # on main: a pull request that breaks the image build (a Dockerfile edit, a
  # base-image bump from Renovate, a file the build needs dropped from the
  # context) passed every check and failed after it merged. Build it here,
  # with the builder and the build step ship.yaml uses, minus everything that
  # needs a credential or leaves something behind: no registry login, no
  # push, no cache import or export, and no `load`, so nothing lands in the
  # runner's shared Docker daemon. Pull requests only; on main ship.yaml is
  # the build.
  #
  # ADVISORY. Its status context is `ci / image (pull_request)`, which the
  # required patterns (`ci / lint*`, `ci / test*`, `secret-scan / gitleaks*`)
  # do not match, so a red build here does not block a merge until someone
  # adds `ci / image*` to branch protection. Keep the job id clear of `lint`
  # and `test` prefixes, or it becomes required by accident.
  image:
    if: ${{ gitea.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `COPY . .` takes the tree, .git included, into a build layer;
          # the job token has no business in it and no later step uses git.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
